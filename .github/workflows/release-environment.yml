name: Release environment

# Deploys a commit to test or public in the same order as production: infrastructure first,
# then the moving tag that Radix builds from, then the database migrations.
on:
    workflow_dispatch:
        inputs:
            environment:
                description: Environment to deploy
                type: choice
                options: [test, public]
            sha:
                description: Commit to deploy (must be pushed to GitHub)
                type: string
                required: true

permissions: {}

concurrency: release-environment-${{ inputs.environment }}

jobs:
    resolve:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}
            tag: ${{ steps.resolve.outputs.tag }}
            github-environment: ${{ steps.resolve.outputs.github-environment }}
        steps:
            - id: resolve
              env:
                  GH_TOKEN: ${{ github.token }}
                  ENVIRONMENT: ${{ inputs.environment }}
                  SHA: ${{ inputs.sha }}
              run: |
                  sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha)
                  case "$ENVIRONMENT" in
                      test) tag=TEST github_environment=Test ;;
                      public) tag=PUBLIC github_environment=Public ;;
                      *) echo "Unknown environment: $ENVIRONMENT" >&2; exit 1 ;;
                  esac
                  {
                      echo "sha=$sha"
                      echo "tag=$tag"
                      echo "github-environment=$github_environment"
                  } >> "$GITHUB_OUTPUT"

    deploy-infra:
        needs: resolve
        permissions:
            id-token: write
            contents: read
        uses: ./.github/workflows/infra-deploy.yml
        with:
            env-name: ${{ inputs.environment }}
            github-environment: ${{ needs.resolve.outputs.github-environment }}
            ref: ${{ needs.resolve.outputs.sha }}

    # Radix builds the UI and API as soon as the tag moves, so it only moves after the
    # infrastructure deployment succeeds.
    move-tag:
        needs: [resolve, deploy-infra]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ needs.resolve.outputs.sha }}
            - env:
                  TAG: ${{ needs.resolve.outputs.tag }}
              run: git push --force origin "HEAD:refs/tags/$TAG"

    # Tags pushed with GITHUB_TOKEN do not start other workflows, so migrations are chained here.
    migrate:
        needs: [resolve, move-tag]
        permissions:
            id-token: write
            contents: read
        uses: ./.github/workflows/api-ef-migrations.yml
        with:
            env-name: ${{ needs.resolve.outputs.github-environment }}
            ref: ${{ needs.resolve.outputs.sha }}
        secrets: inherit
