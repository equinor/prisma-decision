name: API Pull Request
on:
    pull_request:
        branches:
            - main
        paths:
            - "prisma-api/**"
            - ".github/workflows/api-pull-request.yml"

permissions: {}

jobs:
    build:
        name: "Build"
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        defaults:
            run:
                working-directory: prisma-api/src
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: "10.0.x"

            - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: |
                      ~/.nuget/packages
                      ~/.dotnet/tools
                      ./prisma-api/src/PrismaApi.Application/bin
                      ./prisma-api/src/PrismaApi.Domain/bin
                      ./prisma-api/src/PrismaApi.Infrastructure/bin
                      ./prisma-api/src/PrismaApi.Api/bin
                  key: ${{ runner.os }}-dotnet-${{ hashFiles('prisma-api/src/**/*.csproj') }}

            - name: Restore NuGet packages
              run: dotnet restore PrismaApi.sln

            - name: Build projects and their dependencies
              run: dotnet build --no-restore PrismaApi.sln

    integration-tests:
        name: Integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        defaults:
            run:
                working-directory: prisma-api/src
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: "10.0.x"

            - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: |
                      ~/.nuget/packages
                      ~/.dotnet/tools
                      ./prisma-api/src/PrismaApi.Application/bin
                      ./prisma-api/src/PrismaApi.Domain/bin
                      ./prisma-api/src/PrismaApi.Infrastructure/bin
                      ./prisma-api/src/PrismaApi.Api/bin
                  key: ${{ runner.os }}-dotnet-${{ hashFiles('prisma-api/src/**/*.csproj') }}

            - name: Restore NuGet packages
              run: dotnet restore PrismaApi.sln

            - name: Run tests
              run: |
                  dotnet build PrismaApi.sln --configuration Release --no-restore
                  dotnet test PrismaApi.Test/PrismaApi.Test.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"

            - name: Publish test results
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: TestResults
                  path: ./prisma-api/src/PrismaApi.Test/TestResults

            - name: ReportGenerator
              uses: danielpalme/ReportGenerator-GitHub-Action@c31aa4ed4f12f147061186cf2a029f307b5c3636 # 5.2.0
              with:
                  reports: ./prisma-api/src/PrismaApi.Test/TestResults/**/*.cobertura.xml
                  targetdir: coveragereport
                  reporttypes: Html;MarkdownSummaryGithub

            - name: Upload coverage report artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: CoverageReport
                  path: coveragereport

    solver:
        name: Solver dependencies
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: prisma-api/solver
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.11"

            - name: Install poetry
              run: |
                  python -m pip install --upgrade pip
                  pip install poetry

            - name: Install dependencies
              run: poetry install
