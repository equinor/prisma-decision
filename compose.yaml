name: prisma-research

# Research mode: no sign-in and a SQLite database in the api-data volume.
# The UI is served at http://localhost:5004 and calls the API at http://localhost:7075.
services:
  fastapi:
    build:
      context: prisma-api/solver
    ports:
      - "8000:8000"
    networks:
      - appnet

  api:
    build:
      context: prisma-api/src
    # Running as root for local development (SQLite needs write access to volume)
    user: "0:0"
    ports:
      - "7075:7075"
    depends_on:
      - fastapi
    environment:
      ASPNETCORE_ENVIRONMENT: Research
      FastApiService__BaseUrl: http://fastapi:8000
      ConnectionStrings__SqliteConnection: "Data Source=/data/Prisma.db"
      AllowedOrigins__0: http://localhost:5004
      AllowedOrigins__1: http://127.0.0.1:5004
    volumes:
      - api-data:/data
    networks:
      - appnet

  web:
    build:
      context: prisma-ui
      args:
        TARGET_ENVIRONMENTS: research
    ports:
      - "5004:3000"
    environment:
      - NODE_ENV=research

networks:
  appnet:
    driver: bridge

volumes:
  api-data:
